name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build space (windows-2022, MSVC ${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same generator as the README's Windows instructions, linking the
      # bundled Lib/Windows/raylib.lib.
      - name: Configure (Visual Studio 17 2022, x64)
        run: cmake -G "Visual Studio 17 2022" -A x64 -S . -B build-msvc

      - name: Build
        run: cmake --build build-msvc --config ${{ matrix.config }} --parallel

      - name: Check executable
        shell: pwsh
        run: |
          $exe = "build-msvc/${{ matrix.config }}/space.exe"
          if (-not (Test-Path $exe)) { Write-Error "$exe was not produced"; exit 1 }
          Get-Item $exe | Format-List Name, Length
